# =============================================================================
# CTI Multi-Agent System – settings.yaml
# =============================================================================
# All secret keys live in .env (never commit them here).

# ── Default LLM provider ────────────────────────────────────────────────
default_llm: groq
llm_fallback_provider: openrouter

# ── LLM provider configurations ─────────────────────────────────────────
llm:
  openrouter:
    model: openrouter/auto
    endpoint: https://openrouter.ai/api/v1/chat/completions
    temperature: 0.2
    max_tokens: 5000
    timeout: 45
  groq:
    model: llama-3.1-8b-instant
    endpoint: https://api.groq.com/openai/v1/chat/completions
    temperature: 0.2
    max_tokens: 4096
    timeout: 30

# ── Agent configurations ─────────────────────────────────────────────────
agents:
  osint:
    max_retries: 2
    timeout: 30
  analyst:
    max_retries: 2
    timeout: 10
  reporter:
    max_tokens: 2048

# ── Tool configurations ─────────────────────────────────────────────────
tools:
  web_search:
    provider: tavily
    fallback_provider: duckduckgo
    max_results: 10
    provider_timeout_seconds: 15
    min_results_before_fallback: 1
  rag:
    provider: chromadb
    collection_name: cti_reports
    persist_dir: ./data/chroma_db
    embedding_model: all-MiniLM-L6-v2
    chunk_size: 1000
    chunk_overlap: 200
    top_k: 5
  cache:
    ttl_seconds: 3600
    persist_dir: ./data/cache
    filename: cag_cache.json
  input_guard:
    max_length: 5000
    block_injections: true
  output_guard:
    max_output_length: 50000
    redact_credentials: true
    redact_pii: true

# ── Memory configurations ───────────────────────────────────────────────
memory:
  session_memory:
    max_turns: 10
  vector_memory:
    provider: json_keyword
    collection_name: long_term_memory
    persist_dir: ./data/vector_db
    filename: memory.json
    max_records: 1000
  cti_memory:
    persist_dir: ./data/memory
    filename: investigations.jsonl
    max_records: 500

# ── Session settings ────────────────────────────────────────────────────
session:
  max_turns: 10
